<svg xmlns="http://www.w3.org/2000/svg" class="emblem" width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="dda-e-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A76F0"/><stop offset="1" stop-color="#1D4FCB"/>
    </linearGradient>
    <linearGradient id="dda-e-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".40"/><stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dda-e-leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D6E3FF"/>
    </linearGradient>
  </defs>
  <!-- glass tile: action-blue gradient, top gloss, fine light edge -->
  <rect width="28" height="28" rx="8" fill="url(#dda-e-fill)"/>
  <rect x=".5" y=".5" width="27" height="27" rx="7.5" fill="url(#dda-e-gloss)" stroke="#FFFFFF" stroke-opacity=".22"/>
  <!-- door frame with a dark interior -->
  <rect x="9" y="7" width="10" height="14.5" rx="1.3" fill="#0B2463" fill-opacity=".55" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.3"/>
  <!-- the door, ajar: hinged left, free edge swung towards you -->
  <path d="M10.1 8.1 16.9 6.5V22l-6.8-1.6z" fill="url(#dda-e-leaf)"/>
  <circle cx="15.3" cy="14.3" r=".95" fill="#1D4FCB"/>
</svg>
